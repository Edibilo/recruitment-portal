<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<div align="center">
    <div th:replace="~{header :: header}"></div>
    <h2>User List</h2>
    <table border="3">
        <thead>
        <th>#</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
        </thead>
        <tbody>
        <tr th:each="u,stat : ${users}">
            <td th:text="${stat.count}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.roleName}"></td>
            <td>
                <a th:href="@{/api/v1/users/{userId}/edit(userId=${u.id})}"><button>Edit</button></a>
                <a th:href="@{/api/v1/users/{userId}/delete(userId=${u.id})}"><button>Delete</button></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
